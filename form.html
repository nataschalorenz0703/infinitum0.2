<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formular | Eventnavn</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./">Eventnavn</a>
      <nav class="site-nav">
        <button>Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html">Interaktiv SVG</a></li>
          <li><a href="./form.html" aria-current="page">Formular</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="form-page">
      <header class="form-intro">
        <h1>Formular</h1>
        <p>Lav en formular, der sender brugeren videre til opsamlingssiden.</p>
      </header>

      <form class="form-placeholder" action="./opsamling.html">
        <fieldset>
          <legend>What are you coming for?</legend>
          <label for="field-interest-1">
            <input type="checkbox" id="field-interest-1" name="interest" value="techno">
            Techno
          </label>
          <label for="field-interest-2">
            <input type="checkbox" id="field-interest-2" name="interest" value="tattoo">
            Tattoo
          </label>
          <label for="field-interest-3">
            <input type="checkbox" id="field-interest-3" name="interest" value="both">
            Both!
          </label>
        </fieldset>

        <button type="submit">Send</button>
      </form>



    </section>



  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>Eventnavn</p>
      <p>Footer</p>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
